[project]
name = "note-migrator"
version = "0.1.0"
description = "Xiaomi Mi Notes → Vivo Atomic Notes Migration Tool"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "html2text>=2024",
    "markdown-it-py>=3.0",
    "playwright>=1.48",
    "Pillow>=10.0",
    "aiofiles>=23.0",
    "flet>=0.85",
]

[project.scripts]
note-migrator = "src.main:app"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
